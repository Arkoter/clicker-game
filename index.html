<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <h1>Clicker Game</h1>
        <div id="points-container">
            <p>Points : <span id="points">0</span></p>
            <p>Points par clic : <span id="points-per-click">1</span></p>
            <p>Points automatiques par seconde : <span id="auto-points-per-second">0</span></p>
        </div>
        <div id="click-button-container">
            <img id="click-button" src="coin.png" alt="Click me !">
        </div>
        <div id="upgrade-buttons"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
